version: '3.9'

services:
  db:
    image: postgres:14-alpine
    container_name: stylecut_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stylecut_db}
      POSTGRES_USER: ${POSTGRES_USER:-stylecut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stylecutpwd}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stylecut_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Utilize DATABASE_URL para conectar ao Postgres do compose
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-stylecut}:${POSTGRES_PASSWORD:-stylecutpwd}@db:5432/${POSTGRES_DB:-stylecut_db}}
    depends_on:
      - db
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: stylecut_frontend
    restart: unless-stopped
    environment:
      VITE_DEV_SERVER_PORT: 5173
      VITE_PROXY_TARGET: http://backend:3000
      VITE_API_BASE_PATH: /api
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:
